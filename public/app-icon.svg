<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0c192e"/>
      <stop offset="100%" stop-color="#08101f"/>
    </linearGradient>

    <!-- Neon Cyan-Emerald Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.4"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.2"/>

  <!-- Radial Background Glow -->
  <circle cx="256" cy="230" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="256" cy="270" r="130" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Operations Radar / Pulse Rings -->
  <circle cx="256" cy="220" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>
  <circle cx="256" cy="220" r="135" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="220" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Speed Wings & Delivery Motion Flares -->
  <path d="M70 240 Q160 210 230 220 Q140 245 70 240 Z" fill="url(#neonGrad)" opacity="0.7" filter="url(#subtleGlow)"/>
  <path d="M442 240 Q352 210 282 220 Q372 245 442 240 Z" fill="url(#neonGrad)" opacity="0.7" filter="url(#subtleGlow)"/>
  
  <path d="M100 270 Q170 250 225 255 Q150 275 100 270 Z" fill="url(#emeraldGrad)" opacity="0.5"/>
  <path d="M412 270 Q342 250 287 255 Q362 275 412 270 Z" fill="url(#emeraldGrad)" opacity="0.5"/>

  <!-- Dynamic Motorcycle / Rider Silhouette Emblem -->
  <g transform="translate(136, 120)" filter="url(#subtleGlow)">
    <!-- Rear Wheel -->
    <circle cx="48" cy="148" r="34" fill="none" stroke="url(#neonGrad)" stroke-width="12"/>
    <circle cx="48" cy="148" r="18" fill="#091426" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="48" cy="148" r="6" fill="#00f2fe"/>
    
    <!-- Front Wheel -->
    <circle cx="192" cy="148" r="34" fill="none" stroke="url(#neonGrad)" stroke-width="12"/>
    <circle cx="192" cy="148" r="18" fill="#091426" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="192" cy="148" r="6" fill="#00f2fe"/>

    <!-- Motorcycle Frame Body -->
    <path d="M48 148 L96 112 L146 112 L192 148 L152 148 L126 128 L84 148 Z" fill="url(#neonGrad)"/>
    
    <!-- Delivery Box on Back -->
    <rect x="44" y="66" width="46" height="42" rx="8" fill="#0f2647" stroke="url(#neonGrad)" stroke-width="4"/>
    <!-- Box Speed Lines -->
    <line x1="52" y1="80" x2="82" y2="80" stroke="#00e676" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="92" x2="74" y2="92" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Rider Torso & Arms -->
    <path d="M102 82 Q120 74 138 88 L160 114 L146 120 L128 102 L112 118 L94 114 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Rider Helmet -->
    <circle cx="140" cy="58" r="18" fill="url(#neonGrad)"/>
    <path d="M142 54 Q156 56 156 64 Q146 68 136 66 Z" fill="#040d1a"/> <!-- Visor -->

    <!-- Handlebars and Front Fork -->
    <line x1="150" y1="102" x2="168" y2="92" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="168" y1="92" x2="192" y2="148" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Headlight Beam -->
    <polygon points="196,120 250,96 250,144" fill="#00f2fe" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- Live Pulse Dot (1-Sec Indicator) -->
  <circle cx="395" cy="115" r="9" fill="#10b981" filter="url(#glow)"/>
  <circle cx="395" cy="115" r="5" fill="#ffffff"/>

  <!-- Arabic Typography Badge: تشغيل العز -->
  <!-- Shield/Plate Ribbon behind text -->
  <path d="M96 350 L416 350 L386 440 L256 465 L126 440 Z" fill="#091426" stroke="url(#neonGrad)" stroke-width="3" opacity="0.95"/>
  <path d="M110 360 L402 360 L376 432 L256 454 L136 432 Z" fill="#0f1d35" opacity="0.8"/>

  <!-- Text: تشغيل العز -->
  <text x="256" y="398" text-anchor="middle" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1">
    تشغيل العز
  </text>
  
  <!-- Text Subtitle: مدينة نصر -->
  <text x="256" y="432" text-anchor="middle" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-weight="800" font-size="20" fill="url(#neonGrad)" letter-spacing="2">
    مدينة نصر
  </text>

  <!-- Top Crown Accent / Star -->
  <polygon points="256,60 264,74 278,74 266,82 270,96 256,86 242,96 246,82 234,74 248,74" fill="url(#goldGrad)" filter="url(#subtleGlow)"/>
</svg>
